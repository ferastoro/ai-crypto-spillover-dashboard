name: Daily HAR Volatility Forecast Update

on:
  schedule:
    # Runs daily at 01:00 UTC (after previous day daily candle closes at 23:59:59 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Update Pipeline
        run: |
          python live/update_forecast.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/
          if git diff --staged --quiet; then
            echo "No changes in data/live/ to commit."
          else
            git commit -m "chore(data): daily HAR volatility forecast update [skip ci]"
            git push
          fi
